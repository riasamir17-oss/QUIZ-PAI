    <script>
      (function() {
        // Root-level fix: Intercept Vite client HMR WebSocket creation and return a quiet open socket
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = 
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite') !== -1));

            if (isViteHmr) {
              var listeners = {};
              var mockSocket = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                url: String(url),
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {},
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              return mockSocket;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Global unhandled rejection and console filter for any stray vite warnings
        window.addEventListener('unhandledrejection', function(event) {
          var str = event && event.reason ? String(event.reason.message || event.reason) : '';
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1 || str.indexOf('failed to connect') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var str = event && event.message ? String(event.message) : '';
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
